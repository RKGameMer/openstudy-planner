name: Bug 报告
description: 报告可以稳定重现的产品问题。
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        请勿提交真实用户任务、导出备份、截图中的个人信息、密钥、凭据或其他敏感数据。请使用虚构或已脱敏的信息。
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 请简要说明发生了什么。
      placeholder: 例如：保存任务后刷新页面，任务列表没有显示新任务。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 重现步骤
      description: 请提供可重复的操作步骤。
      placeholder: |
        1. 打开……
        2. 输入虚构任务……
        3. 点击……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
      description: 你原本希望发生什么？
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 实际发生了什么？
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 浏览器和设备
      description: 例如浏览器名称及版本、手机或桌面设备类型。不要提供不必要的个人信息。
      placeholder: 例如：Chrome 版本……，Android 手机
    validations:
      required: true
  - type: dropdown
    id: local-data
    attributes:
      label: 是否涉及本地数据？
      description: 仅选择情况，不要上传真实任务或备份文件。
      options:
        - 否
        - 是，但未附带真实数据
        - 不确定
    validations:
      required: true
